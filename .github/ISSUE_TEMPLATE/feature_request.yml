name: Feature request
description: Propose a new portable capability or quality check
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What source-slide pattern should be supported better?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: Explain the desired PageIR, compiler, validation, or workflow change.
    validations:
      required: true
