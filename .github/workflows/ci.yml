name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm install
      - name: Validate skill structure
        run: python scripts/validate_skill.py .
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example PageIR
        run: python scripts/validate_page_ir.py examples/minimal/page_ir.json
      - name: Compile example PPTX
        run: node scripts/compile_page_ir.js examples/minimal/page_ir.json /tmp/example.pptx
      - name: Inspect compiled PPTX
        run: python scripts/inspect_pptx.py /tmp/example.pptx
      - name: Package skill
        run: python scripts/package_skill.py . --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zip
          path: dist/skill.zip
